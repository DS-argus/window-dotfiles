# leaf — Nord (transparent)
#
# Nord 팔레트를 Leaf 테마 스키마에 매핑한다. 터미널 배경이 비치도록
# content/toc/status 표면은 reset으로 유지하고, 강조 요소만 Nord 색을 사용한다.

base = "ocean"
syntax = "base16-ocean.dark"

[ui]
content_bg = "reset"
toc_bg = "reset"
toc_inactive_bg = "reset"
status_bg = "reset"
toc_border = "#434C5E"
status_separator = "#4C566A"
status_brand_fg = "#2E3440"
status_brand_bg = "#88C0D0"
status_filename_fg = "#D8DEE9"
status_filename_bg = "#3B4252"
status_watch_fg = "#A3BE8C"
status_watch_bg = "#3B4252"
status_reloaded_fg = "#2E3440"
status_reloaded_bg = "#A3BE8C"
status_search_fg = "#EBCB8B"
status_search_bg = "#3B4252"
status_success_fg = "#A3BE8C"
status_success_bg = "#3B4252"
status_warning_fg = "#EBCB8B"
status_error_fg = "#BF616A"
status_error_bg = "#3B4252"
status_shortcut_fg = "#616E88"
status_percent_fg = "#88C0D0"
scrollbar_hover = "#88C0D0"
toc_hover_fg = "#ECEFF4"
toc_header_fg = "#616E88"
toc_active_bg = "#3B4252"
toc_accent = "#88C0D0"
toc_index_inactive = "#4C566A"
toc_primary_active = "#ECEFF4"
toc_primary_inactive = "#D8DEE9"
toc_secondary_inactive = "#4C566A"
toc_secondary_text_active = "#D8DEE9"
toc_secondary_text_inactive = "#616E88"

[markdown]
text = "#D8DEE9"
strong_text = "#ECEFF4"
rule = "#434C5E"
heading_1 = "#88C0D0"
heading_2 = "#A3BE8C"
heading_3 = "#81A1C1"
heading_4 = "#B48EAD"
heading_other = "#D08770"
heading_underline = "#434C5E"
code_frame = "#4C566A"
code_gutter = "#4C566A"
code_label = "#616E88"
inline_code_fg = "#D08770"
inline_code_bg = "#3B4252"
list_level_1 = "#A3BE8C"
list_level_2 = "#88C0D0"
list_level_3 = "#B48EAD"
ordered_list = "#EBCB8B"
task_checked = "#A3BE8C"
task_unchecked = "#616E88"
table_border = "#4C566A"
table_separator = "#434C5E"
table_header = "#88C0D0"
table_cell = "#D8DEE9"
blockquote_marker = "#616E88"
blockquote_text = "#D8DEE9"
link_icon = "#88C0D0"
link_text = "#88C0D0"
link_hover = "#8FBCBB"
search_highlight_bg = "#434C5E"
search_match_bg = "#EBCB8B"
mark_fg = "#ECEFF4"
mark_bg = "#5E81AC"
latex_inline_fg = "#B48EAD"
latex_inline_bg = "#3B4252"
latex_block_fg = "#B48EAD"
mermaid_keyword = "#D08770"
mermaid_arrow = "#88C0D0"
mermaid_label = "#A3BE8C"
mermaid_block_fg = "#D8DEE9"
alert_note = "#81A1C1"
alert_tip = "#A3BE8C"
alert_important = "#B48EAD"
alert_warning = "#EBCB8B"
alert_caution = "#BF616A"
footnote_ref = "#88C0D0"
footnote_text = "#D8DEE9"
