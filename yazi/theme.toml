[flavor]
# For Yazi 0.4 and above
dark = "nord"

[cmp]
icon_file = "󰈔"
icon_folder = "󰉋"
icon_command = "󰘳"

[icon]
prepend_dirs = [
	{ name = ".config", text = "󰒓", fg = "#81A1C1" },
	{ name = ".git", text = "󰊢", fg = "#BF616A" },
	{ name = "Desktop", text = "󰟀", fg = "#81A1C1" },
	{ name = "Documents", text = "󰈙", fg = "#A3BE8C" },
	{ name = "Downloads", text = "󰉍", fg = "#EBCB8B" },
	{ name = "Pictures", text = "󰋩", fg = "#8FBCBB" },
]

prepend_files = [
	{ name = ".gitignore", text = "󰊢", fg = "#BF616A" },
	{ name = "Dockerfile", text = "󰡨", fg = "#88C0D0" },
	{ name = "README.md", text = "󰍔", fg = "#88C0D0" },
]

prepend_exts = [
	{ name = "md", text = "󰍔", fg = "#88C0D0" },
	{ name = "lua", text = "󰢱", fg = "#81A1C1" },
	{ name = "toml", text = "󰰤", fg = "#EBCB8B" },
	{ name = "yaml", text = "󰈙", fg = "#EBCB8B" },
	{ name = "yml", text = "󰈙", fg = "#EBCB8B" },
	{ name = "json", text = "󰘦", fg = "#A3BE8C" },
	{ name = "lock", text = "󰌾", fg = "#B48EAD" },
	{ name = "png", text = "󰋩", fg = "#8FBCBB" },
	{ name = "jpg", text = "󰋩", fg = "#8FBCBB" },
	{ name = "jpeg", text = "󰋩", fg = "#8FBCBB" },
	{ name = "svg", text = "󰜡", fg = "#8FBCBB" },
	{ name = "zip", text = "󰗄", fg = "#B48EAD" },
	{ name = "tar", text = "󰗄", fg = "#B48EAD" },
	{ name = "gz", text = "󰗄", fg = "#B48EAD" },
	{ name = "7z", text = "󰗄", fg = "#B48EAD" },
	{ name = "mp3", text = "󰎆", fg = "#EBCB8B" },
	{ name = "wav", text = "󰎆", fg = "#EBCB8B" },
	{ name = "mp4", text = "󰕧", fg = "#EBCB8B" },
]

prepend_conds = [
	{ if = "hidden & dir", text = "󰉖", fg = "#4C566A" },
	{ if = "hidden", text = "󰘓", fg = "#4C566A" },
	{ if = "link", text = "", fg = "#B48EAD" },
	{ if = "orphan", text = "", fg = "#BF616A" },
	{ if = "exec & !dir", text = "󰆍", fg = "#A3BE8C" },
	{ if = "dir", text = "󰉋", fg = "#81A1C1" },
]
