<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useEffect, useState } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        date: { type: 'date', formatting: 'MM/dd HH:mm' },
        cpu: { type: 'cpu', refreshInterval: 3000 },
        memory: { type: 'memory', refreshInterval: 3000 },
        battery: { type: 'battery', refreshInterval: 5000 },
        audio: { type: 'audio' },
      });

      const appIcons = {
        applicationframehost: ':gear:',
        chatgpt: ':openai:',
        chrome: ':google_chrome:',
        code: ':code:',
        discord: ':discord:',
        explorer: ':finder:',
        firefox: ':firefox:',
        kakaotalk: ':kakaotalk:',
        msedge: ':microsoft_edge:',
        notepad: ':textedit:',
        spotify: ':spotify:',
        windowsterminal: ':terminal:',
      };

      function collectWindows(container) {
        if (!container) return [];
        if (container.type === 'window') return [container];
        return (container.children ?? []).flatMap(collectWindows);
      }

      function workspaceApplications(workspace) {
        const applications = new Map();

        collectWindows(workspace).forEach(window => {
          if (window.processName && !applications.has(window.processName)) {
            applications.set(window.processName, window);
          }
        });

        return [...applications.values()];
      }

      function iconForProcess(processName) {
        return appIcons[processName?.toLowerCase()] ?? ':default:';
      }

      function volumeIcon(device, volume) {
        if (!device || device.isMuted || volume === 0) return '󰖁';
        if (volume < 35) return '󰕿';
        if (volume < 70) return '󰖀';
        return '󰕾';
      }

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput({ ...providers.outputMap }));
        }, []);

        const glazewm = output.glazewm;
        const focusedWindow =
          glazewm?.focusedContainer?.type === 'window'
            ? glazewm.focusedContainer
            : null;
        const currentWorkspaces = [...(glazewm?.currentWorkspaces ?? [])]
          .filter(
            workspace =>
              workspaceApplications(workspace).length > 0 ||
              workspace.isDisplayed ||
              workspace.hasFocus,
          )
          .sort(
            (left, right) =>
              Number(left.name) - Number(right.name) ||
              left.name.localeCompare(right.name),
          );
        const batteryPercent = output.battery
          ? Math.max(0, Math.min(100, Math.round(output.battery.chargePercent)))
          : null;
        const playbackDevice = output.audio?.defaultPlaybackDevice;
        const volume = playbackDevice
          ? Math.max(0, Math.min(100, Math.round(playbackDevice.volume)))
          : null;

        return (
          <main className="bar">
            <section className="left">
              <div className="workspaces">
                {currentWorkspaces.map(workspace => {
                  const applications = workspaceApplications(workspace);
                  const isOccupied = applications.length > 0;
                  const appNames = applications.map(application => application.processName).join(', ');

                  return (
                    <button
                      className={`workspace${isOccupied ? ' occupied' : ''}${workspace.isDisplayed ? ' displayed' : ''}${workspace.hasFocus ? ' focused' : ''}`}
                      key={workspace.name}
                      onClick={() => glazewm.runCommand(`focus --workspace ${workspace.name}`)}
                      title={`Workspace ${workspace.name}${appNames ? ` · ${appNames}` : ' · empty'}`}
                    >
                      <span className="workspace-label">
                        {workspace.displayName ?? workspace.name}
                      </span>
                      {isOccupied && (
                        <span className="workspace-apps" aria-label={appNames}>
                          {applications.map(application => (
                            <span
                              className="workspace-app-icon"
                              key={application.processName}
                              title={application.processName}
                            >
                              {iconForProcess(application.processName)}
                            </span>
                          ))}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </section>

            <section className="center">
              <div className="mode-status">
                {glazewm?.isPaused && <span className="status paused">PAUSED</span>}
                {glazewm?.bindingModes.map(mode => (
                  <button
                    className="status mode"
                    key={mode.name}
                    onClick={() => glazewm.runCommand(`wm-disable-binding-mode --name ${mode.name}`)}
                  >
                    {mode.displayName ?? mode.name}
                  </button>
                ))}
              </div>
              {focusedWindow && (
                <div className="active-window" title={`${focusedWindow.processName} · ${focusedWindow.title}`}>
                  <span className="active-indicator" aria-hidden="true"></span>
                  <span className="process-name">{focusedWindow.processName}</span>
                  <span className="title-separator">·</span>
                  <span className="window-title">{focusedWindow.title}</span>
                </div>
              )}
            </section>

            <section className="right">
              {glazewm && (
                <button
                  className="direction"
                  onClick={() => glazewm.runCommand('toggle-tiling-direction')}
                  title={`Tiling · ${glazewm.tilingDirection}`}
                >
                  {glazewm.tilingDirection === 'horizontal' ? 'H' : 'V'}
                </button>
              )}
              {playbackDevice && (
                <button
                  className={`compact audio${playbackDevice.isMuted ? ' muted' : ''}`}
                  title={`${playbackDevice.name} · ${playbackDevice.isMuted ? 'Muted' : `${volume}%`}`}
                  onClick={() => output.audio.setMute(!playbackDevice.isMuted)}
                  onWheel={event => {
                    event.preventDefault();
                    const nextVolume = Math.max(0, Math.min(100, volume - Math.sign(event.deltaY) * 5));
                    output.audio.setVolume(nextVolume);
                  }}
                >
                  <span className="compact-icon">{volumeIcon(playbackDevice, volume)}</span>
                  <span>{volume}</span>
                </button>
              )}
              {output.cpu && (
                <span
                  className={output.cpu.usage > 85 ? 'compact warning' : 'compact'}
                  title={`CPU · ${Math.round(output.cpu.usage)}%`}
                >
                  <span className="compact-icon"></span>
                  <span>{Math.round(output.cpu.usage)}</span>
                </span>
              )}
              {output.memory && (
                <span className="compact" title={`Memory · ${Math.round(output.memory.usage)}%`}>
                  <span className="compact-icon">󰍛</span>
                  <span>{Math.round(output.memory.usage)}</span>
                </span>
              )}
              {output.battery && (
                <span
                  className={`compact battery${batteryPercent <= 20 ? ' warning' : ''}${output.battery.isCharging ? ' charging' : ''}`}
                  title={`${output.battery.isCharging ? 'Charging' : 'Battery'} · ${batteryPercent}%`}
                >
                  <span className="compact-icon">{output.battery.isCharging ? '󰂄' : '󰁹'}</span>
                  <span>{batteryPercent}</span>
                </span>
              )}
              <span className="clock" title={output.date?.formatted}>
                {output.date?.formatted}
              </span>
            </section>
          </main>
        );
      }

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
