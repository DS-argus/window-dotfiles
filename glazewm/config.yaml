general:
  startup_commands:
    - 'shell-exec zebar start-widget-preset --pack window-dotfiles --widget-name bar --preset default'
  shutdown_commands:
    - 'shell-exec taskkill /F /IM zebar.exe'
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: window_focus
  hide_method: cloak
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: 10px
  outer_gap:
    top: 5px
    right: 5px
    bottom: 5px
    left: 5px

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#f9e2af'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: square
    transparency:
      enabled: false
      opacity: 95%
  other_windows:
    border:
      enabled: false
      color: '#313244'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: square
    transparency:
      enabled: false
      opacity: 92%

window_behavior:
  initial_state: tiling
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# GlazeWM numbers monitors from left to right. Workspaces 1-4 stay on the
# right-hand display and 5-9 on the left-hand display when both are present.
workspaces:
  - name: '1'
    bind_to_monitor: 1
    keep_alive: true
  - name: '2'
    bind_to_monitor: 1
    keep_alive: true
  - name: '3'
    bind_to_monitor: 1
    keep_alive: true
  - name: '4'
    bind_to_monitor: 1
    keep_alive: true
  - name: '5'
    bind_to_monitor: 0
    keep_alive: true
  - name: '6'
    bind_to_monitor: 0
    keep_alive: true
  - name: '7'
    bind_to_monitor: 0
    keep_alive: true
  - name: '8'
    bind_to_monitor: 0
    keep_alive: true

  - name: '9'
    bind_to_monitor: 0
    keep_alive: true

window_rules:
  # Keep transient PowerToys and Office helper windows out of the tiling tree.
  - commands: [ignore]
    match:
      - window_process: { equals: zebar }
      - window_process: { equals: PowerToys }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: WinUIDesktopWin32WindowClass }
      - window_process: { equals: PowerToys }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: EXCEL }
        window_class: { not_regex: XLMAIN }
      - window_process: { equals: WINWORD }
        window_class: { not_regex: OpusApp }
      - window_process: { equals: POWERPNT }
        window_class: { not_regex: PPTFrameClass }

  # Ensure applications with non-standard window behavior stay tiled.
  - commands: [set-tiling]
    match:
      - window_process: { equals: WindowsTerminal }
      - window_class: { equals: EVA_Window_Dblclk }

binding_modes:
  - name: resize
    keybindings:
      - commands: ['resize --width -2%']
        bindings: [h, left]
      - commands: ['resize --width +2%']
        bindings: [l, right]
      - commands: ['resize --height +2%']
        bindings: [k, up]
      - commands: ['resize --height -2%']
        bindings: [j, down]
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: [escape, enter, 'alt+r']

keybindings:
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction down']
    bindings: ['alt+j']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction right']
    bindings: ['alt+l']

  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']

  - commands: ['resize --width +2%']
    bindings: ['alt+oem_plus']
  - commands: ['resize --width -2%']
    bindings: ['alt+oem_minus']
  - commands: ['resize --height +2%']
    bindings: ['alt+shift+oem_plus']
  - commands: ['resize --height -2%']
    bindings: ['alt+shift+oem_minus']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  - commands: [close]
    bindings: ['alt+q']
  - commands: [toggle-minimized]
    bindings: ['alt+m']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+t']
  - commands: [toggle-fullscreen]
    bindings: ['alt+shift+f']
  - commands: [wm-toggle-pause]
    bindings: ['alt+p']
  - commands: [wm-redraw]
    bindings: ['alt+shift+r']
  - commands: [wm-reload-config]
    bindings: ['alt+shift+o']

  - commands: [toggle-tiling-direction]
    bindings: ['alt+shift+space']
  - commands: ['set-tiling-direction horizontal']
    bindings: ['alt+x']
  - commands: ['set-tiling-direction vertical']
    bindings: ['alt+y']

  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  - commands: ['move --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9']
    bindings: ['alt+shift+9']
